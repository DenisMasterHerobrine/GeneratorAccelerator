# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version=2.0.21
maven_group=dev.denismasterherobrine
archives_name=generatoraccelerator2
enabled_platforms=fabric,forge

# Minecraft properties
minecraft_version=1.20.1

# Dependencies
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1
forge_version=1.20.1-47.4.10

# Libraries
mixinextras_version=0.4.1
mixinsquared_version=0.3.3
# Forge 47 ships Mixin 0.8.5, which reads @Redirect's `at` as a single @At, as this one does.
compile_mixin_version=0.16.4+mixin.0.8.7
# The LWJGL 1.20.1 ships. GA2's OpenCL bindings load next to the game's LWJGL core, so the versions must match.
lwjgl_version=3.3.1
