// The Minecraft name table GA2 reads on Fabric (platform.Names): a production Fabric game runs under intermediary names, while
// GA2's code names vanilla classes and members by their Mojang names (inspection tables, reflection, generated bytecode).
// The table holds every Minecraft class GA2's compiled code refers to, their supertypes and all their members, plus the
// names of the classes those members' descriptors mention; the build bundles it as generatoraccelerator2/mappings.txt.gz.

import java.nio.charset.StandardCharsets
import java.util.regex.Pattern
import java.util.zip.GZIPOutputStream
import java.util.zip.ZipFile

def namesDir = layout.buildDirectory.dir('generated/ga2Names')

/** Super class and interfaces of a class file: just enough of the format to reach them. */
def readSupers = { byte[] bytes ->
    def in = new DataInputStream(new ByteArrayInputStream(bytes))
    in.skipBytes(8) // magic, minor, major
    int count = in.readUnsignedShort()
    def utf8 = new String[count]
    def classIndex = new int[count]
    for (int i = 1; i < count; i++) {
        int tag = in.readUnsignedByte()
        switch (tag) {
            case 1: utf8[i] = in.readUTF(); break
            case 7: classIndex[i] = in.readUnsignedShort(); break
            case 8: case 16: case 19: case 20: in.skipBytes(2); break
            case 3: case 4: case 9: case 10: case 11: case 12: case 17: case 18: in.skipBytes(4); break
            case 5: case 6: in.skipBytes(8); i++; break
            case 15: in.skipBytes(3); break
            default: throw new GradleException("unknown constant pool tag ${tag}")
        }
    }
    in.skipBytes(4) // access, this
    def out = []
    int superIndex = in.readUnsignedShort()
    if (superIndex != 0) {
        out << utf8[classIndex[superIndex]]
    }
    int interfaces = in.readUnsignedShort()
    for (int i = 0; i < interfaces; i++) {
        out << utf8[classIndex[in.readUnsignedShort()]]
    }
    return out
}

def generateNames = tasks.register('generateGa2Names') {
    group = 'build'
    description = 'Writes the Mojang to intermediary name table of the Minecraft classes GA2 refers to.'
    def commonClasses = project(':common').layout.buildDirectory.dir('classes/java/main')
    def fabricClasses = layout.buildDirectory.dir('classes/java/main')
    def mappingFiles = configurations.mappings
    def compileClasspath = sourceSets.main.compileClasspath
    def outFile = namesDir.map { it.file('generatoraccelerator2/mappings.txt.gz') }
    dependsOn project(':common').tasks.named('compileJava'), tasks.named('compileJava')
    inputs.files(commonClasses, fabricClasses, mappingFiles)
    outputs.file(outFile)

    doLast {
        // the tiny mappings: intermediary and named (Mojang) per class and member
        File mappingsJar = mappingFiles.singleFile
        def lines
        new ZipFile(mappingsJar).withCloseable { zip ->
            lines = zip.getInputStream(zip.getEntry('mappings/mappings.tiny')).getText('UTF-8').readLines()
        }
        def header = lines[0].split('\t')
        int inter = header.toList().subList(3, header.length).indexOf('intermediary')
        int named = header.toList().subList(3, header.length).indexOf('named')
        if (inter < 0 || named < 0) {
            throw new GradleException("unexpected mappings header: ${lines[0]}")
        }
        def interToNamed = [:]
        def namedToInter = [:]
        def methods = [:].withDefault { [] } // named class -> [named name, intermediary desc, intermediary name]
        def fields = [:].withDefault { [] }  // named class -> [named name, intermediary name]
        String cls = null
        for (String line : lines.subList(1, lines.size())) {
            def p = line.split('\t', -1)
            if (p[0] == 'c') {
                cls = p[1 + named]
                interToNamed[p[1 + inter]] = cls
                namedToInter[cls] = p[1 + inter]
            } else if (p.length > 1 && p[0] == '' && p[1] == 'm') {
                // first namespace column is the descriptor's namespace (intermediary)
                methods[cls] << [p[3 + named], p[2], p[3 + inter]]
            } else if (p.length > 1 && p[0] == '' && p[1] == 'f') {
                fields[cls] << [p[3 + named], p[3 + inter]]
            }
        }
        def mapDesc = { String desc ->
            desc.replaceAll(/L([^;]+);/) { all, c -> 'L' + (interToNamed[c] ?: c) + ';' }
        }

        // every Minecraft class name GA2's bytecode mentions (class references, descriptors, string constants)
        def slashed = Pattern.compile('net/minecraft/[A-Za-z0-9_$/]+')
        def dotted = Pattern.compile('net\\.minecraft\\.[A-Za-z0-9_$.]+')
        Set<String> wanted = new TreeSet<>()
        [commonClasses.get().asFile, fabricClasses.get().asFile].each { dir ->
            if (!dir.exists()) {
                return
            }
            dir.eachFileRecurse { f ->
                if (!f.name.endsWith('.class')) {
                    return
                }
                String text = new String(f.bytes, StandardCharsets.ISO_8859_1)
                def m = slashed.matcher(text)
                while (m.find()) {
                    wanted << m.group()
                }
                m = dotted.matcher(text)
                while (m.find()) {
                    wanted << m.group().replace('.', '/')
                }
            }
        }
        wanted.retainAll(namedToInter.keySet())

        // their supertypes, read from the Mojang-named game jar
        File gameJar = compileClasspath.files.find { f ->
            f.name.endsWith('.jar') && f.name.startsWith('minecraft-') && new ZipFile(f).withCloseable { it.getEntry('net/minecraft/server/MinecraftServer.class') != null }
        }
        if (gameJar == null) {
            throw new GradleException('the Mojang-named Minecraft jar is not on the compile classpath')
        }
        def supers = [:]
        new ZipFile(gameJar).withCloseable { zip ->
            def queue = new ArrayDeque<String>(wanted)
            while (!queue.isEmpty()) {
                String c = queue.poll()
                if (supers.containsKey(c)) {
                    continue
                }
                def entry = zip.getEntry(c + '.class')
                def list = entry == null ? [] : readSupers(zip.getInputStream(entry).bytes).findAll { namedToInter.containsKey(it) }
                supers[c] = list
                list.each { s ->
                    if (!supers.containsKey(s)) {
                        wanted << s
                        queue << s
                    }
                }
            }
        }

        // the classes named in those members' descriptors: names only, so descriptors translate
        Set<String> descClasses = new TreeSet<>()
        wanted.each { c ->
            methods[c].each { m ->
                (m[1] =~ /L([^;]+);/).each { all, ic -> if (interToNamed.containsKey(ic)) descClasses << interToNamed[ic] }
            }
        }
        descClasses.removeAll(wanted)

        def out = new StringBuilder()
        int memberCount = 0
        wanted.each { c ->
            out.append('c\t').append(c).append('\t').append(namedToInter[c])
            supers[c].each { out.append('\t').append(it) }
            out.append('\n')
            methods[c].each { m ->
                if (m[0] != m[2]) {
                    out.append('m\t').append(m[0]).append(mapDesc(m[1])).append('\t').append(m[2]).append('\n')
                    memberCount++
                }
            }
            fields[c].each { f ->
                if (f[0] != f[1]) {
                    out.append('f\t').append(f[0]).append('\t').append(f[1]).append('\n')
                    memberCount++
                }
            }
        }
        descClasses.each { c -> out.append('c\t').append(c).append('\t').append(namedToInter[c]).append('\n') }

        File target = outFile.get().asFile
        target.parentFile.mkdirs()
        new GZIPOutputStream(new FileOutputStream(target)).withCloseable { it.write(out.toString().getBytes(StandardCharsets.UTF_8)) }
        logger.lifecycle("GA2 name table: ${wanted.size()} classes with ${memberCount} members, ${descClasses.size()} more class names")
    }
}

sourceSets.main.resources.srcDir(files(namesDir).builtBy(generateNames))
