plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    testCompileClasspath.extendsFrom common
    testRuntimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Bundled: lets GA2 cancel the mixins it takes over from other performance mods (see compat/Takeover)
    include(implementation("com.github.bawnorton.mixinsquared:mixinsquared-fabric:$rootProject.mixinsquared_version"))

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

apply from: file('names.gradle')

// The tests run inside Fabric Loader (fabric-loader-junit), so GA2's mixins are applied to the game they test, as they were
// in NeoForge's unit test environment. The game is bootstrapped once by testutil.GameBootstrap.
dependencies {
    testImplementation "net.fabricmc:fabric-loader-junit:$rootProject.fabric_loader_version"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "org.lwjgl:lwjgl-opencl:$rootProject.lwjgl_version"
}

test {
    useJUnitPlatform()
    systemProperty 'generatoraccelerator2.dfc.strict', 'true'
    // the GPU path stays out of the exactness tests' CPU references unless a test run turns it on (-Dgeneratoraccelerator2.gpu=true)
    systemProperty 'generatoraccelerator2.gpu', System.getProperty('generatoraccelerator2.gpu', 'false')
    // GA2 switches read once at class load, opt-in benchmarks (-Dga2.bench=true), the GPU harness's options and Mixin's debug
    // options (-Dmixin.debug.export=true) pass through
    System.getProperties().stringPropertyNames().findAll { it.startsWith('generatoraccelerator2.') || it.startsWith('ga2.') || it.startsWith('mixin.') }.each { p ->
        systemProperty p, System.getProperty(p)
    }
    // GA2 is one mod made of this module's and the common module's outputs (the common one holds the access widener and the
    // mixin configs); Loom groups them for its run configurations, the tests are told here
    doFirst {
        def own = classpath.files.findAll { f ->
            def p = f.absolutePath.replace(File.separatorChar, '/' as char)
            (p.contains('/fabric/build/') || p.contains('/common/build/')) && !p.contains('/test')
        }
        systemProperty 'fabric.classPathGroups', own*.absolutePath.join(File.pathSeparator)
    }
    // a flight recording of the test JVM (-Dga2.jfr=<file>)
    if (System.getProperty('ga2.jfr')) {
        jvmArgs "-XX:StartFlightRecording=filename=${System.getProperty('ga2.jfr')},settings=profile,method-profiling=max,allocation-profiling=maximum", '-XX:FlightRecorderOptions:stackdepth=256'
    }
    maxHeapSize = '4G'
    // tests seed the JDK's shared shuffle random (Collections.r), which vanilla's beehive decorator draws from
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full'; showStandardStreams = true }
}
