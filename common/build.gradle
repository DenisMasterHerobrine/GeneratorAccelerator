architectury {
    common rootProject.enabled_platforms.split(',')
}

// The GPU path's nested libraries (gpu.cl.ClLoader reads them from META-INF/ga2-gpu/, named by artifact and classifier).
// Bundled as resources of the common jar, so both platform jars carry them.
configurations {
    gpuBundle
}
def gpuLibsDir = layout.buildDirectory.dir('generated/gpuLibs')
def bundleGpuLibs = tasks.register('bundleGpuLibs', Sync) {
    from(configurations.gpuBundle)
    into(gpuLibsDir.map { it.dir('META-INF/ga2-gpu') })
}
sourceSets.main.resources.srcDir(files(gpuLibsDir).builtBy(bundleGpuLibs))

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // @Nullable and friends (NeoForge has them on its classpath; annotations only, not needed at run time)
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Both loaders ship MixinExtras; MixinSquared is bundled by each platform jar.
    compileOnly "io.github.llamalad7:mixinextras-common:$rootProject.mixinextras_version"
    compileOnly "com.github.bawnorton.mixinsquared:mixinsquared-common:$rootProject.mixinsquared_version"

    // GPU worldgen (gpu/): the OpenCL bindings are compiled against here and shipped inside the jar as a nested library
    // (gpuBundle), loaded at run time by gpu.cl.ClLoader in a class loader of its own next to the LWJGL core the game
    // ships (clients) or the bundled core and natives (dedicated servers, which have no LWJGL)
    compileOnly "org.lwjgl:lwjgl-opencl:$rootProject.lwjgl_version"
    gpuBundle("org.lwjgl:lwjgl-opencl:$rootProject.lwjgl_version") { transitive = false }
    gpuBundle("org.lwjgl:lwjgl:$rootProject.lwjgl_version") { transitive = false }
    ['natives-windows', 'natives-windows-arm64', 'natives-linux', 'natives-macos', 'natives-macos-arm64'].each { c ->
        gpuBundle("org.lwjgl:lwjgl:$rootProject.lwjgl_version:${c}") { transitive = false }
    }
}

