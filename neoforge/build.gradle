import net.fabricmc.loom.configuration.IncludeConfigurations

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Bundled: lets GA2 cancel the mixins it takes over from other performance mods (see compat/Takeover)
    include(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:$rootProject.mixinsquared_version"))

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

loom {
    neoForge {
        // NeoForge has no access widener support: convert the common AW into META-INF/accesstransformer.cfg.
        convertAccessWideners(tasks.named('shadowJar'), 'generatoraccelerator2.accesswidener')
    }
}

// Loom nests the `include` jars only into the `jar` task's output on this version. The shadow jar is the jar that ships, so it
// nests them too. GA2's takeovers need the bundled MixinSquared (see compat/Takeover).
IncludeConfigurations.nestJars(project, tasks.named('shadowJar', Jar), configurations.named('include'))
