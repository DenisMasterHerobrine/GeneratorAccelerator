name: Build on Tag

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build tagged revision
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew build --no-daemon

      - name: Detect release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ github.ref_name }}
          path: |
            fabric/build/libs/*.jar
            fabric/build/devlibs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-${{ github.ref_name }}
          path: |
            neoforge/build/libs/*.jar
            neoforge/build/devlibs/*.jar
          if-no-files-found: error

      - name: Upload Common artifacts
        uses: actions/upload-artifact@v4
        with:
          name: common-${{ github.ref_name }}
          path: common/build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.release_tag.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            fabric/build/libs/*.jar
            fabric/build/devlibs/*.jar
            neoforge/build/libs/*.jar
            neoforge/build/devlibs/*.jar
            common/build/libs/*.jar
