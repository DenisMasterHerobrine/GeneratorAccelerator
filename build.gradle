plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// Full version is `<minecraft_version>-<mod_version>.<build_number>`, e.g. 1.21.1-2.0.19.143.
// The build number lives in build_number.properties and is bumped after every successful local `build`.
// CI builds use the committed number as-is.
def isCi = providers.environmentVariable('CI').map { it.toBoolean() }.getOrElse(false)
def buildNumberFile = file('build_number.properties')
def buildNumberProps = new Properties()
buildNumberFile.withInputStream { buildNumberProps.load(it) }
def buildNumber = buildNumberProps.getProperty('build_number').trim() as int

allprojects {
    group = rootProject.maven_group
    version = "${rootProject.minecraft_version}-${rootProject.mod_version}.${buildNumber}"
}

def incrementBuildNumber = tasks.register('incrementBuildNumber') {
    group = 'versioning'
    description = 'Increments the build number in build_number.properties.'

    def buildTasks = providers.provider { gradle.taskGraph.allTasks.findAll { it.name == 'build' } }
    onlyIf { !isCi && buildTasks.get().every { it.state.executed && it.state.failure == null } }

    doLast {
        buildNumberFile.text = buildNumberFile.text.replaceFirst(/(?m)^build_number=\d+/, "build_number=${buildNumber + 1}")
        logger.lifecycle("Build number: ${buildNumber} -> ${buildNumber + 1}")
    }
}

// Concurrent bumps on different branches would conflict in build_number.properties.
// .gitattributes routes that file through a merge driver that keeps the higher number;
// register the driver in the local git config so it works in every clone without manual setup.
if (!isCi && file('.git').exists()) {
    def gitConfig = { String... args ->
        providers.exec {
            commandLine(['git', 'config', '--local'] + args.toList())
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    }
    def driver = 'sh gradle/merge-build-number.sh %O %A %B'
    if (gitConfig('--get', 'merge.buildnumber.driver') != driver) {
        gitConfig('merge.buildnumber.name', 'Keep the highest build number')
        gitConfig('merge.buildnumber.driver', driver)
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `generatoraccelerator2-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    loom {
        accessWidenerPath = rootProject.file('common/src/main/resources/generatoraccelerator2.accesswidener')
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        mavenCentral()
        // MixinSquared (cancels other performance mods' mixins on the code GA2 takes over)
        maven {
            url = 'https://jitpack.io'
            content { includeGroup 'com.github.bawnorton.mixinsquared' }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    // Compile against NeoForge's Mixin, not the newer one Fabric Loader brings: Mixin 0.17.4 made @Redirect's `at` an array,
    // so javac writes it as one, and MixinExtras (and older Mixin) read it as a single @At and crash on every class GA2 redirects in.
    configurations.named('compileClasspath') {
        resolutionStrategy.force "net.fabricmc:sponge-mixin:$rootProject.compile_mixin_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
        withSourcesJar()

        // compiled by a Java 21 compiler, as FNR was: Mixin reads a mixin's field initialisers from its constructor by line number,
        // and newer compilers number the implicit constructor differently (the initialisers are then not applied)
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    tasks.named('build') {
        finalizedBy incrementBuildNumber
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
        }
    }
}
