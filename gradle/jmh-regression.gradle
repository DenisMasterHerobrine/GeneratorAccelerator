// JMH history and comparison tasks. Usage: gradle/README.md.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

@UntrackedTask(because = 'It writes into a user-visible history directory and must run every time')
abstract class JmhCompare extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getCurrent()

    @Optional
    @InputFile
    abstract RegularFileProperty getRunMetadata()

    @Internal
    abstract DirectoryProperty getResultsDir()

    @Input
    abstract Property<String> getTag()

    @Input
    abstract Property<String> getRunArgs()

    @Input
    abstract Property<Double> getThreshold()

    @Input
    abstract Property<String> getBaselineFile()

    @Input
    abstract Property<Boolean> getFailOnRegression()

    @Input
    abstract Property<String> getJavaVersion()

    @Input
    abstract Property<String> getGitDir()

    @Internal
    abstract Property<Boolean> getQuiet()

    @TaskAction
    void compare() {
        File root = resultsDir.get().asFile
        File bestDir = new File(root, "best/${tag.get()}")
        bestDir.mkdirs()
        new RandomAccessFile(new File(bestDir, '.lock'), 'rw').withCloseable { lockFile ->
            lockFile.channel.withCloseable { channel ->
                channel.lock().withCloseable { ignored -> compareLocked(root, bestDir) }
            }
        }
    }

    void compareLocked(File root, File bestDir) {
        JsonSlurper slurper = new JsonSlurper()
        List raw = slurper.parse(current.get().asFile) as List
        if (raw.isEmpty()) {
            throw new GradleException('JMH produced no results. A failed fork still exits with 0, look for ' +
                'ExceptionInInitializerError in the log above. Nothing was saved.')
        }

        List<Map> results = raw.collectMany { metrics(it as Map) }
        if (results.any { !Double.isFinite(toDouble(it.score)) }) {
            throw new GradleException('JMH produced non-finite scores. No best results were changed.')
        }
        String stamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss-SSS'))
        String tagName = tag.get()
        File historyDir = new File(root, "history/${tagName}")
        File rawDir = new File(root, "raw/${tagName}")
        File reportDir = new File(root, "reports/${tagName}")
        [historyDir, rawDir, reportDir].each { it.mkdirs() }

        File bestFile = new File(bestDir, 'best.json')
        Map<String, Map> best = bestFile.isFile() ? load(slurper, bestFile) : [:]
        // Migrate old history only once. A persisted record is never replaced by a worse run.
        List<File> history = (historyDir.listFiles({ File f -> f.name.endsWith('.json') } as FileFilter) ?: new File[0]).toList()
        if (!bestFile.isFile() && tagName == 'regression') {
            File legacy = new File(root, 'history/flat-climate')
            history.addAll((legacy.listFiles({ File f -> f.name.endsWith('.json') } as FileFilter) ?: new File[0]).toList())
        }
        history.sort { it.name }
        if (!bestFile.isFile()) {
            history.each { file -> mergeBest(best, load(slurper, file).values().toList(), [:]) }
        }
        Map previous = history.isEmpty() ? [:] : ((slurper.parse(history.last()) as Map).meta ?: [:]) as Map
        String explicit = baselineFile.get()
        int imported = 0
        if (explicit) {
            File file = new File(explicit)
            if (!file.isFile()) {
                throw new GradleException("jmh.baseline file does not exist: ${file}")
            }
            imported = mergeBest(best, load(slurper, file).values().toList(), [:])
        }

        Map started = runMetadata.isPresent() && runMetadata.get().asFile.isFile()
            ? slurper.parse(runMetadata.get().asFile) as Map : [:]
        Map meta = [
            timestamp: stamp,
            tag      : tagName,
            args     : runArgs.get(),
            jdk      : javaVersion.get(),
            gitCommit: started.containsKey('gitCommit') ? started.gitCommit : git('rev-parse', 'HEAD'),
            gitDirty : started.containsKey('gitDirty') ? started.gitDirty : !(git('status', '--porcelain') ?: '').isEmpty(),
            startedAt: started.startedAt,
            os       : System.getProperty('os.name'),
            cpus     : Runtime.runtime.availableProcessors(),
            previousCommit: previous.gitCommit,
            previousDirty: previous.gitDirty,
            previousRun: previous.timestamp
        ]
        writeAtomic(new File(historyDir, "${stamp}.json"), JsonOutput.prettyPrint(JsonOutput.toJson([meta: meta, results: results])))
        Files.copy(current.get().asFile.toPath(), new File(rawDir, "${stamp}.json").toPath(), StandardCopyOption.REPLACE_EXISTING)

        List<Map> rows = results.collect { r ->
            Map base = best[r.key]
            judge(r, base, base?.origin?.timestamp as String, threshold.get()) + [record: better(r, base)]
        }
        int updated = mergeBest(best, results, meta)
        if (!bestFile.isFile() || updated > 0 || imported > 0) {
            writeAtomic(bestFile, JsonOutput.prettyPrint(JsonOutput.toJson([
                formatVersion: 1, tag: tagName, updatedAt: stamp, results: best.values().toList().sort { it.key }
            ])))
            writeAtomic(new File(bestDir, 'best.md'), renderBest(best.values().toList(), meta))
        } else if (!new File(bestDir, 'best.md').isFile()) {
            writeAtomic(new File(bestDir, 'best.md'), renderBest(best.values().toList(), meta))
        }
        meta.recordsUpdated = updated
        String report = render(rows, meta, threshold.get())
        writeAtomic(new File(reportDir, "${stamp}.md"), report)
        writeAtomic(new File(reportDir, 'latest.md'), report)
        if (tagName == 'regression') {
            writeAtomic(new File(root, 'regrssionBenchmark.md'), report.replace('../../best/', 'best/'))
        }

        if (!quiet.getOrElse(false)) {
            logSummary(rows, new File(reportDir, "${stamp}.md"), threshold.get())
            logger.lifecycle("Best records updated: ${updated}; leaderboard: ${new File(bestDir, 'best.md')}")
        }

        int regressions = rows.count { it.verdict == 'REGRESSION' } as int
        if (regressions > 0 && failOnRegression.get()) {
            throw new GradleException("${regressions} JMH regression(s) found, see ${new File(reportDir, stamp + '.md')}")
        }
    }

    static Map condense(Map r) {
        Map metric = r.primaryMetric as Map
        double score = toDouble(metric.score)
        double error = toDouble(metric.scoreError)
        Map params = (r.params ?: [:]) as Map
        String paramText = params.keySet().sort().collect { "${it}=${params[it]}" }.join(',')
        String benchmark = canonicalBenchmark(r.benchmark as String)
        return [
            key      : "${benchmark}|${r.mode}|${r.threads}|${paramText}".toString(),
            benchmark: benchmark,
            category : category(benchmark),
            mode     : r.mode,
            threads  : r.threads,
            params   : paramText,
            score    : score,
            // Missing confidence intervals are NaN in JMH, which JSON cannot represent.
            error    : Double.isNaN(error) ? null : error,
            unit     : metric.scoreUnit
        ]
    }

    static List<Map> metrics(Map raw) {
        Map primary = condense(raw)
        List<Map> entries = [primary]
        (raw.secondaryMetrics ?: [:]).each { name, value ->
            if (name in ['gc.alloc.rate.norm', 'gc.alloc.rate', 'gc.count', 'gc.time']) {
                Map metric = value as Map
                double score = toDouble(metric.score)
                double error = toDouble(metric.scoreError)
                if (Double.isFinite(score)) {
                    entries.add(primary + [
                        key: "${primary.key}|${name}".toString(),
                        metric: name,
                        mode: 'avgt',
                        score: score,
                        error: Double.isFinite(error) ? error : null,
                        unit: metric.scoreUnit,
                        informational: name != 'gc.alloc.rate.norm'
                    ])
                }
            }
        }
        return entries
    }

    static double toDouble(Object value) {
        if (value instanceof Number) {
            return ((Number) value).doubleValue()
        }
        return value == null ? Double.NaN : Double.parseDouble(value.toString())
    }

    static Map load(JsonSlurper slurper, File file) {
        Object parsed = slurper.parse(file)
        List entries = parsed instanceof Map ? (parsed.results as List) : (parsed as List)
        Map byKey = [:]
        Map origin = parsed instanceof Map ? ((parsed.meta ?: [:]) as Map) : [:]
        origin = [timestamp: origin.timestamp ?: file.name - '.json', gitCommit: origin.gitCommit ?: 'unknown',
            gitDirty: origin.gitDirty ?: false, jdk: origin.jdk, args: origin.args]
        entries.each { e ->
            List<Map> entriesForResult = e.containsKey('primaryMetric') ? metrics(e as Map) : [e as Map]
            entriesForResult.each { entry ->
                String oldName = entry.benchmark
                String newName = canonicalBenchmark(oldName)
                Map normalized = entry + [benchmark: newName, category: category(newName),
                    key: newName + entry.key.toString().substring(oldName.length()), origin: entry.origin ?: origin]
                byKey[normalized.key] = normalized
            }
        }
        return byKey
    }

    static String canonicalBenchmark(String name) {
        String prefix = 'dev.denismasterherobrine.generatoraccelerator2.bench.'
        Map moves = [FlatClimateTreeBenchmark: 'biome.flatclimateindex.FlatClimateTreeBenchmark',
            BiomeBenchmark: 'optional.biome.BiomeBenchmark',
            BiomeTreeBuildBenchmark: 'optional.biome.flatclimateindex.BiomeTreeBuildBenchmark']
        for (def move : moves) {
            if (name.startsWith(prefix + move.key + '.')) {
                return prefix + move.value + name.substring((prefix + move.key).length())
            }
        }
        return name
    }

    static String category(String benchmark) {
        String marker = '.bench.'
        int start = benchmark.indexOf(marker)
        if (start < 0) {
            return 'Other'
        }
        List<String> parts = benchmark.substring(start + marker.length()).split('\\.').toList()
        List<String> packages = parts.size() > 2 ? parts[0..-3].findAll { it != 'optional' } : []
        Map labels = [biome: 'Biome', flatclimateindex: 'FlatClimateIndex', noise: 'Noise', cpu: 'Noise CPU', gpu: 'Noise GPU']
        return packages ? packages.collect { labels[it] ?: it.capitalize() }.join(' → ') : 'Other'
    }

    static boolean better(Map current, Map best) {
        if (current.informational || !Double.isFinite(toDouble(current.score)) || toDouble(current.score) < 0d) {
            return false
        }
        if (best == null) {
            return true
        }
        if (current.unit != best.unit) {
            return false
        }
        return current.mode == 'thrpt' ? toDouble(current.score) > toDouble(best.score) : toDouble(current.score) < toDouble(best.score)
    }

    static int mergeBest(Map best, List<Map> candidates, Map origin) {
        int changed = 0
        candidates.each { entry ->
            if (better(entry, best[entry.key] as Map)) {
                best[entry.key] = entry + [origin: entry.origin ?: origin]
                changed++
            }
        }
        return changed
    }

    static void writeAtomic(File target, String value) {
        target.parentFile.mkdirs()
        def temporary = Files.createTempFile(target.parentFile.toPath(), '.jmh-', '.tmp')
        try {
            Files.writeString(temporary, value, java.nio.charset.StandardCharsets.UTF_8)
            try {
                Files.move(temporary, target.toPath(), StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                Files.move(temporary, target.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            Files.deleteIfExists(temporary)
        }
    }

    static Map judge(Map cur, Map base, String baseName, double thresholdPercent) {
        Map row = [cur: cur, base: base, baseName: baseName, delta: null, verdict: 'NEW']
        if (cur.informational) {
            row.verdict = 'INFO'
            return row
        }
        if (base == null) {
            return row
        }
        if (cur.unit != base.unit) {
            row.verdict = 'UNIT CHANGED'
            return row
        }
        double c = cur.score as double
        double b = base.score as double
        if (b == 0d) {
            // A formerly allocation-free operation starting to allocate must fail the gate too.
            row.verdict = c == 0d ? 'SAME' :
                (cur.metric == 'gc.alloc.rate.norm' && c - ((cur.error ?: 0d) as double) > 0d ? 'REGRESSION' : 'ZERO BASELINE')
            return row
        }
        double cErr = (cur.error ?: 0d) as double
        double bErr = (base.error ?: 0d) as double
        boolean lowerIsBetter = cur.mode != 'thrpt'
        // A positive delta means regression for both time and throughput.
        double delta = (lowerIsBetter ? (c - b) / b : (b - c) / b) * 100d
        boolean worseBeyondNoise = lowerIsBetter ? (c - cErr > b + bErr) : (c + cErr < b - bErr)
        boolean betterBeyondNoise = lowerIsBetter ? (c + cErr < b - bErr) : (c - cErr > b + bErr)
        row.delta = delta
        if (delta > thresholdPercent && worseBeyondNoise) {
            row.verdict = 'REGRESSION'
        } else if (delta < -thresholdPercent && betterBeyondNoise) {
            row.verdict = 'IMPROVEMENT'
        } else {
            row.verdict = 'SAME'
        }
        return row
    }

    static String displayName(Map entry) {
        List<String> parts = (entry.benchmark as String).split('\\.').toList()
        String shortName = parts.size() > 1 ? parts[-2..-1].join('.') : parts[0]
        List<String> params = (entry.params ?: '').toString().split(',').findAll { it && !it.startsWith('scenario=') }
        if (parts[-2] == 'FlatClimateTreeBenchmark') {
            String system = params.find { it.startsWith('system=') }
            if (system) {
                shortName = 'FlatClimateTreeBenchmark.' + system.substring('system='.length())
                params.remove(system)
            }
        }
        return params ? "${shortName} [${params.join(',')}]" : shortName
    }

    static String num(Map entry) {
        if (entry == null) {
            return '-'
        }
        String format = entry.score != 0 && Math.abs(entry.score as double) < 0.01d ? '%.6f' : '%.3f'
        String text = String.format(Locale.ROOT, format, entry.score as double)
        if (entry.error != null) {
            text += ' ± ' + String.format(Locale.ROOT, format, entry.error as double)
        }
        return "${text} ${entry.unit}"
    }

    static String render(List<Map> rows, Map meta, double thresholdPercent) {
        Map<String, Integer> order = [REGRESSION: 0, 'UNIT CHANGED': 1, NEW: 2, 'ZERO BASELINE': 2, IMPROVEMENT: 3, SAME: 4, INFO: 5]
        List<Map> sorted = rows.sort(false) { a, b -> order[a.verdict] <=> order[b.verdict] ?: displayName(a.cur) <=> displayName(b.cur) }
        StringBuilder sb = new StringBuilder()
        sb << "# Regression benchmarks — ${meta.tag}\n\n"
        sb << "- Run: ${meta.timestamp}\n"
        if (meta.startedAt) {
            sb << "- Started: ${meta.startedAt}\n"
        }
        sb << "- JDK: ${meta.jdk}, ${meta.os}, ${meta.cpus} CPUs\n"
        sb << "- Commit: ${meta.gitCommit ?: 'unknown'}${meta.gitDirty ? ' (dirty working tree)' : ''}\n"
        sb << "- Previous tested commit: ${meta.previousCommit ?: 'none'}${meta.previousDirty ? ' (dirty working tree)' : ''}\n"
        sb << "- Previous run: ${meta.previousRun ?: 'none'}\n"
        sb << "- Arguments: ${meta.args ?: '(none)'}\n"
        sb << "- Regression threshold: ${thresholdPercent}% outside confidence intervals\n"
        sb << "- Best records updated: ${meta.recordsUpdated ?: 0}\n"
        sb << "- [Saved best results](../../best/${meta.tag}/best.md)\n\n"
        sb << "Timing and B/op have independent records. Equal or worse scores never replace a record.\n"
        sb << "Record updates use strictly better scores; the regression verdict also considers threshold and confidence intervals.\n"
        sorted.groupBy { it.cur.category ?: category(it.cur.benchmark) }.sort().each { group, groupRows ->
            sb << "\n## ${group}\n"
            groupRows.groupBy { scenario(it.cur) }.sort().each { scenarioName, scenarioRows ->
                sb << "\n### ${scenarioName}\n\n"
                sb << '| Benchmark | Metric | Previous best | Current | Change | Verdict | Best commit | New record |\n'
                sb << '| --- | --- | ---: | ---: | ---: | --- | --- | --- |\n'
                scenarioRows.findAll { !it.cur.informational }.each { row ->
                    String change = row.delta == null ? '-' : String.format(Locale.ROOT, '%+.1f%%', row.delta as double)
                    sb << "| ${md(displayName(row.cur))} | ${metricLabel(row.cur)} | ${num(row.base)} | ${num(row.cur)} | ${change} | ${row.verdict} | ${commit(row.base?.origin as Map)} | ${row.record ? 'yes' : '-'} |\n"
                }
                List info = scenarioRows.findAll { it.cur.informational }
                if (info) {
                    sb << '\n<details>\n<summary>GC information (not used as records)</summary>\n\n'
                    sb << '| Benchmark | Metric | Current |\n| --- | --- | ---: |\n'
                    info.each { row -> sb << "| ${md(displayName(row.cur))} | ${row.cur.metric} | ${num(row.cur)} |\n" }
                    sb << '\n</details>\n'
                }
            }
        }
        sb << "\nPositive change means slower execution, lower throughput or more bytes allocated per operation.\n"
        sb << "Allocation per operation is compared using the same threshold as timing. Allocation rate, GC count and GC time are informational.\n"
        sb << "GC metrics may include invocation setup allocations. They do not measure retained heap or prove a memory leak.\n"
        return sb.toString()
    }

    static String renderBest(List<Map> best, Map meta) {
        StringBuilder sb = new StringBuilder("# Best benchmark results — ${meta.tag}\n\n")
        sb << "Updated: ${meta.timestamp}. This file changes only when a new record is saved.\n\n"
        sb << "Each row retains its own commit and run; time and allocation records may come from different commits.\n"
        best.sort(false) { it.key }.groupBy { it.category ?: category(it.benchmark) }.sort().each { group, entries ->
            sb << "\n## ${group}\n"
            entries.groupBy { scenario(it) }.sort().each { scenarioName, scenarioEntries ->
                sb << "\n### ${scenarioName}\n\n"
                sb << '| Benchmark | Metric | Best | Commit | Run |\n| --- | --- | ---: | --- | --- |\n'
                scenarioEntries.each { entry ->
                    sb << "| ${md(displayName(entry))} | ${metricLabel(entry)} | ${num(entry)} | ${commit(entry.origin as Map)} | ${entry.origin?.timestamp ?: 'unknown'} |\n"
                }
            }
        }
        return sb.toString()
    }

    static String scenario(Map entry) {
        def match = (entry.params ?: '') =~ /(?:^|,)scenario=([^,]+)/
        return match.find() ? match.group(1) : 'Default'
    }

    static String metricLabel(Map entry) {
        return entry.metric == 'gc.alloc.rate.norm' ? 'Allocation (B/op)' : (entry.metric ?: 'Time / throughput')
    }

    static String commit(Map origin) {
        String id = origin?.gitCommit ?: 'unknown'
        return "`${md(id.take(12))}`${origin?.gitDirty ? ' (dirty)' : ''}"
    }

    static String md(Object value) {
        return value == null ? '-' : value.toString().replace('|', '\\|').replace('\n', ' ').replace('\r', ' ')
    }

    void logSummary(List<Map> rows, File reportFile, double thresholdPercent) {
        Map<String, Integer> counts = [:].withDefault { 0 }
        rows.each { counts[it.verdict as String]++ }
        rows.findAll { it.verdict in ['REGRESSION', 'IMPROVEMENT', 'UNIT CHANGED'] }.sort { displayName(it.cur) }.each { row ->
            String change = row.delta == null ? '' : String.format(Locale.ROOT, ' (%+.1f%%)', row.delta as double)
            logger.lifecycle(String.format('%-12s %s: %s -> %s%s', row.verdict, displayName(row.cur), num(row.base), num(row.cur), change))
        }
        logger.lifecycle("JMH: ${rows.size()} metric rows, ${counts['REGRESSION']} regressions, ${counts['IMPROVEMENT']} improvements, " +
            "${counts['SAME']} unchanged, ${counts['NEW']} new (threshold ${thresholdPercent}%)")
        logger.lifecycle("Report: ${reportFile}")
    }

    String git(String... args) {
        return gitAt(new File(gitDir.get()), args)
    }

    static String gitAt(File directory, String... args) {
        try {
            List<String> command = ['git'] + args.toList()
            Process process = new ProcessBuilder(command).directory(directory).redirectErrorStream(true).start()
            String out = process.inputStream.text.trim()
            return process.waitFor() == 0 ? out : null
        } catch (Exception ignored) {
            return null
        }
    }

    static void captureRun(File output, File directory) {
        writeAtomic(output, JsonOutput.toJson([
            gitCommit: gitAt(directory, 'rev-parse', 'HEAD'),
            gitDirty: !(gitAt(directory, 'status', '--porcelain') ?: '').isEmpty(),
            startedAt: LocalDateTime.now().toString()
        ]))
    }
}

def hasBenchmarkSourceSet = project.extensions.findByName('sourceSets')?.findByName('benchmark') != null
if (!hasBenchmarkSourceSet) {
    throw new GradleException("jmh-regression.gradle needs a 'benchmark' source set with JMH on its classpath")
}

def quick = providers.gradleProperty('jmh.quick').isPresent()
def tagName = providers.gradleProperty('jmh.tag').getOrElse(quick ? 'quick' : 'full')
def includeRegex = providers.gradleProperty('jmh.include').getOrElse('')
def extraArgs = providers.gradleProperty('jmh.args').getOrElse('')
def quickArgs = quick ? '-f 1 -wi 1 -i 2 -w 1 -r 1' : ''
def resultsPath = providers.gradleProperty('jmh.resultsDir').getOrElse('benchmark-results')
def currentJson = layout.buildDirectory.file('jmh-regression/current.json')
def currentMeta = layout.buildDirectory.file('jmh-regression/current.meta.json')
def gitDirectory = layout.projectDirectory.asFile
def gcEnabled = providers.gradleProperty('jmh.gc').map { it.toBoolean() }.getOrElse(true)
def extraTokens = extraArgs.tokenize()
def hasGcProfiler = extraTokens.any { it == 'gc' || it.startsWith('gc:') ||
    it == 'org.openjdk.jmh.profile.GCProfiler' || it.startsWith('org.openjdk.jmh.profile.GCProfiler:') }
def gcArgs = gcEnabled && !hasGcProfiler ? '-prof gc' : ''
def allArgs = [quickArgs, gcArgs, extraArgs].findAll { !it.isEmpty() }.join(' ')

// Use the existing benchmark task to keep the same classpath and Java toolchain.
def existingBenchmark = tasks.findByName('benchmark')
def benchmarkClasspath = existingBenchmark instanceof JavaExec ? existingBenchmark.classpath : sourceSets.benchmark.runtimeClasspath
def benchmarkLauncher = existingBenchmark instanceof JavaExec ? existingBenchmark.javaLauncher : null

def jmhRun = tasks.register('jmhRun', JavaExec) {
    group = 'benchmark'
    description = 'Runs the JMH suite and writes build/jmh-regression/current.json (no history, no comparison)'
    dependsOn tasks.named('benchmarkClasses')
    classpath = benchmarkClasspath
    mainClass = 'org.openjdk.jmh.Main'
    if (benchmarkLauncher != null) {
        javaLauncher = benchmarkLauncher
    }
    def jmhArgs = []
    if (!includeRegex.isEmpty()) {
        jmhArgs << includeRegex
    }
    jmhArgs.addAll(['-foe', 'true', '-rf', 'json', '-rff', currentJson.get().asFile.absolutePath])
    if (!allArgs.isEmpty()) {
        jmhArgs.addAll(allArgs.tokenize())
    }
    args = jmhArgs
    doNotTrackState('A benchmark run is never up to date')
    def stale = currentJson.get().asFile
    def metadata = currentMeta.get().asFile
    doFirst {
        stale.parentFile.mkdirs()
        stale.delete()
        JmhCompare.captureRun(metadata, gitDirectory)
    }
}

def jmhCompare = tasks.register('jmhCompare', JmhCompare) {
    group = 'benchmark'
    description = 'Saves the last jmhRun output into benchmark-results/ and compares it with the previous runs'
    dependsOn jmhRun
    current = currentJson
    runMetadata = currentMeta.filter { it.asFile.isFile() }
    resultsDir = objects.directoryProperty().fileValue(file(resultsPath))
    tag = tagName
    runArgs = ((includeRegex.isEmpty() ? '' : includeRegex + ' ') + allArgs).trim()
    threshold = providers.gradleProperty('jmh.threshold').map { it.toDouble() }.orElse(5.0d)
    baselineFile = providers.gradleProperty('jmh.baseline').orElse('')
    failOnRegression = providers.gradleProperty('jmh.failOnRegression').map { it.toBoolean() }.orElse(false)
    javaVersion = (benchmarkLauncher != null ? benchmarkLauncher.map { it.metadata.jvmVersion } : providers.provider { 'unknown' }).orElse('unknown')
    gitDir = layout.projectDirectory.asFile.absolutePath
}

tasks.register('jmhRegression') {
    group = 'benchmark'
    description = 'Runs all JMH benchmarks, saves the results and reports regressions/improvements against the previous run'
    dependsOn jmhCompare
}

// Deterministic checks of the regression policy; no timing-sensitive assertions or JMH forks.
def comparisonFixture = tasks.register('_jmhComparisonFixture', JmhCompare) {
    current = layout.buildDirectory.file('tmp/jmh-policy/current.json')
    resultsDir = layout.buildDirectory.dir('tmp/jmh-policy/results')
    tag = 'fixture'
    runArgs = 'synthetic policy fixtures, not performance measurements'
    threshold = 5d
    baselineFile = ''
    failOnRegression = false
    javaVersion = 'fixture'
    quiet = true
    gitDir = layout.projectDirectory.asFile.absolutePath
}
def regressionTest = tasks.register('jmhRegressionTest') {
    group = 'verification'
    description = 'Checks JMH comparison direction, confidence intervals and allocation regressions'
    doLast {
        def metric = { score, error = 1d, mode = 'avgt' ->
            [score: score, error: error, mode: mode, unit: 'ns/op']
        }
        def verdict = { Map cur, Map base -> JmhCompare.judge(cur, base, 'fixture', 5d).verdict }
        assert verdict(metric(120d), metric(100d)) == 'REGRESSION'
        assert verdict(metric(80d), metric(100d)) == 'IMPROVEMENT'
        assert verdict(metric(103d), metric(100d)) == 'SAME'
        assert verdict(metric(120d, 30d), metric(100d)) == 'SAME'
        assert verdict(metric(80d, 1d, 'thrpt'), metric(100d, 1d, 'thrpt')) == 'REGRESSION'
        assert verdict(metric(120d, 1d, 'thrpt'), metric(100d, 1d, 'thrpt')) == 'IMPROVEMENT'
        assert verdict(metric(100d), null) == 'NEW'
        assert verdict(metric(100d), metric(100d) + [unit: 'us/op']) == 'UNIT CHANGED'
        assert verdict(metric(100d) + [informational: true], metric(1d)) == 'INFO'
        assert verdict(metric(16d, 0d) + [metric: 'gc.alloc.rate.norm'], metric(0d, 0d)) == 'REGRESSION'
        assert verdict(metric(0d, 0d), metric(0d, 0d)) == 'SAME'
        def entries = JmhCompare.metrics([
            benchmark: 'Fixture.lookup', mode: 'avgt', threads: 1, params: [preset: 'NETHER'],
            primaryMetric: [score: 100d, scoreError: 'NaN', scoreUnit: 'ns/op'],
            secondaryMetrics: [
                'gc.alloc.rate.norm': [score: 16d, scoreError: 0d, scoreUnit: 'B/op'],
                'gc.alloc.rate': [score: 10d, scoreError: 0d, scoreUnit: 'MB/sec']
            ]
        ])
        assert entries.size() == 3
        assert entries[0].error == null
        assert !entries[1].informational
        assert entries[2].informational
        assert entries*.key.toSet().size() == 3
        assert JmhCompare.category('example.bench.biome.flatclimateindex.Tree.run') == 'Biome → FlatClimateIndex'
        assert JmhCompare.category('example.bench.noise.cpu.Noise.run') == 'Noise → Noise CPU'
        assert JmhCompare.category('example.bench.noise.gpu.Noise.run') == 'Noise → Noise GPU'
        assert JmhCompare.category('example.bench.optional.biome.Tree.run') == 'Biome'
        assert !JmhCompare.better(metric(100d), metric(100d))
        assert !JmhCompare.better(metric(120d), metric(100d))
        assert JmhCompare.better(metric(99.99d), metric(100d))
        assert JmhCompare.better(metric(120d, 1d, 'thrpt'), metric(100d, 1d, 'thrpt'))
        assert !JmhCompare.better(metric(1d) + [informational: true], null)
        assert !JmhCompare.better(metric(Double.NaN), null)
        assert !JmhCompare.better(metric(1d) + [unit: 'us/op'], metric(100d))

        // Exercise actual JSON persistence and Markdown generation without launching JMH.
        File fixtureRoot = Files.createTempDirectory(temporaryDir.toPath(), 'policy-').toFile()
        File input = new File(fixtureRoot, 'current.json')
        def comparison = comparisonFixture.get()
        comparison.current.set(input)
        comparison.resultsDir.set(new File(fixtureRoot, 'results'))
        comparison.tag.set('fixture')
        def sample = { score, allocation ->
            [benchmark: 'dev.denismasterherobrine.generatoraccelerator2.bench.biome.flatclimateindex.FlatClimateTreeBenchmark.subsystem',
                mode: 'avgt', threads: 1, params: [scenario: 'realistic', system: 'search'],
                primaryMetric: [score: score, scoreError: 1d, scoreUnit: 'ns/op'],
                secondaryMetrics: ['gc.alloc.rate.norm': [score: allocation, scoreError: 0.01d, scoreUnit: 'B/op']]]
        }
        def run = { score, allocation ->
            JmhCompare.writeAtomic(input, JsonOutput.toJson([sample(score, allocation)]))
            comparison.compare()
        }
        run(100d, 10d)
        File bestFile = new File(fixtureRoot, 'results/best/fixture/best.json')
        File bestMd = new File(fixtureRoot, 'results/best/fixture/best.md')
        String original = bestFile.getText('UTF-8')
        String originalMd = bestMd.getText('UTF-8')
        def originalModified = Files.getLastModifiedTime(bestFile.toPath())
        run(120d, 12d)
        run(100d, 10d)
        assert bestFile.getText('UTF-8') == original
        assert bestMd.getText('UTF-8') == originalMd
        assert Files.getLastModifiedTime(bestFile.toPath()) == originalModified
        Map oldRecords = JmhCompare.load(new JsonSlurper(), bestFile)
        run(90d, 12d)
        Map improved = JmhCompare.load(new JsonSlurper(), bestFile)
        assert improved.values().find { !it.metric }.score == 90d
        assert improved.values().find { it.metric } == oldRecords.values().find { it.metric }
        String improvedText = bestFile.getText('UTF-8')
        run(110d, 11d)
        assert bestFile.getText('UTF-8') == improvedText
        run(89.99d, 10d)
        assert JmhCompare.load(new JsonSlurper(), bestFile).values().find { !it.metric }.score == 89.99d
        File snapshot = new File(fixtureRoot, 'started.json')
        JmhCompare.captureRun(snapshot, gitDirectory)
        Map captured = new JsonSlurper().parse(snapshot) as Map
        assert captured.containsKey('gitCommit') && captured.gitDirty instanceof Boolean && captured.startedAt
        JmhCompare.writeAtomic(snapshot, JsonOutput.toJson([gitCommit: 'cccccccccccc', gitDirty: false, startedAt: 'fixture-start']))
        comparison.runMetadata.set(snapshot)
        run(110d, 12d)
        assert new File(fixtureRoot, 'results/reports/fixture/latest.md').getText('UTF-8').contains('Commit: cccccccccccc')
        comparison.runMetadata.unset()

        File migrationRoot = new File(fixtureRoot, 'migration')
        def legacy = { score, commitId, name ->
            Map rawEntry = sample(score, 10d)
            rawEntry.benchmark = 'dev.denismasterherobrine.generatoraccelerator2.bench.FlatClimateTreeBenchmark.subsystem'
            // Legacy normalized history used the original Java package and had no per-record origin.
            List normalized = JmhCompare.metrics(rawEntry).collect { e ->
                String newName = e.benchmark
                e + [benchmark: rawEntry.benchmark, key: rawEntry.benchmark + e.key.substring(newName.length())]
            }
            JmhCompare.writeAtomic(new File(migrationRoot, 'history/flat-climate/' + name + '.json'),
                JsonOutput.toJson([meta: [timestamp: name, gitCommit: commitId, gitDirty: false], results: normalized]))
        }
        legacy(100d, 'aaaaaaaaaaaa', '20000101-000000')
        legacy(120d, 'bbbbbbbbbbbb', '20000102-000000')
        comparison.resultsDir.set(migrationRoot)
        comparison.tag.set('regression')
        run(110d, 12d)
        Map migrated = JmhCompare.load(new JsonSlurper(), new File(migrationRoot, 'best/regression/best.json'))
        assert migrated.values().find { !it.metric }.score == 100d
        assert migrated.values().find { !it.metric }.origin.gitCommit == 'aaaaaaaaaaaa'
        assert migrated.values().every { it.benchmark.contains('.biome.flatclimateindex.') }
        String report = new File(migrationRoot, 'regrssionBenchmark.md').getText('UTF-8')
        assert report.contains('Biome → FlatClimateIndex')
        assert report.contains('Previous tested commit: bbbbbbbbbbbb')
        assert report.contains('aaaaaaaaaaaa')
        assert report.contains('REGRESSION')
        logger.lifecycle('JMH regression policy checks passed')
    }
}
jmhCompare.configure { dependsOn regressionTest }
tasks.named('check') { dependsOn regressionTest }

// Mandatory bounded FlatClimateTree suite, isolated from optional benchmark filters/quick flags.
def flatJson = layout.buildDirectory.file('jmh-regression/regression-current.json')
def regressionMeta = layout.buildDirectory.file('jmh-regression/regression-current.meta.json')
def flatRun = tasks.register('regrssionBenchmarkRun', JavaExec) {
    group = 'benchmark'
    description = 'Runs categorized mandatory regression benchmarks (bounded to 15 minutes)'
    dependsOn tasks.named('benchmarkClasses')
    classpath = benchmarkClasspath
    if (benchmarkLauncher != null) {
        javaLauncher = benchmarkLauncher
    }
    mainClass = 'org.openjdk.jmh.Main'
    args '.*\\.bench\\.(?!optional\\.).*', '-prof', 'gc', '-foe', 'true', '-rf', 'json', '-rff', flatJson.get().asFile.absolutePath
    timeout = java.time.Duration.ofMinutes(15)
    doNotTrackState('Mandatory performance measurements must execute every time')
    def output = flatJson.get().asFile
    def metadata = regressionMeta.get().asFile
    doFirst {
        output.parentFile.mkdirs()
        output.delete()
        JmhCompare.captureRun(metadata, gitDirectory)
    }
}
def flatRegression = tasks.register('regrssionBenchmark', JmhCompare) {
    group = 'verification'
    description = 'Runs categorized benchmarks and compares timing/allocations against saved best records'
    dependsOn flatRun, regressionTest
    current = flatJson
    runMetadata = regressionMeta.filter { it.asFile.isFile() }
    resultsDir = objects.directoryProperty().fileValue(file(resultsPath))
    tag = providers.gradleProperty('jmh.tag').orElse(providers.gradleProperty('flatClimate.tag')).orElse('regression')
    runArgs = 'bench.* excluding bench.optional.*; FlatClimateIndex: realistic,absurd; 5x200ms warmup + 5x200ms measurement; -prof gc; -f 1'
    threshold = providers.gradleProperty('jmh.threshold').map { it.toDouble() }.orElse(5.0d)
    baselineFile = providers.gradleProperty('jmh.baseline').orElse('')
    failOnRegression = true
    javaVersion = (benchmarkLauncher != null ? benchmarkLauncher.map { it.metadata.jvmVersion } : providers.provider { 'unknown' }).orElse('unknown')
    gitDir = layout.projectDirectory.asFile.absolutePath
    doFirst {
        def required = ['search', 'columns', 'outsideFill', 'walkColumns', 'fittest', 'fittestColumns',
            'walkFittestColumns', 'reusedFittest', 'alone', 'aloneByValue', 'secondAlone',
            'distance', 'build', 'coldCache', 'adaptiveCache', 'lifecycle']
        def expected = ['realistic', 'absurd'].collectMany { scenario -> required.collect { "${scenario}|${it}".toString() } }.toSet()
        def rows = new JsonSlurper().parse(flatJson.get().asFile) as List
        def flatRows = rows.findAll { JmhCompare.canonicalBenchmark(it.benchmark as String).contains('.biome.flatclimateindex.FlatClimateTreeBenchmark.') }
        def actual = flatRows.collect { "${it.params.scenario}|${it.params.system}".toString() }.toSet()
        if (flatRows.size() != expected.size() || actual != expected || flatRows.any { it.mode != 'avgt' || it.threads != 1 } || rows.any {
            !Double.isFinite(JmhCompare.toDouble(it.primaryMetric.score)) ||
                !it.secondaryMetrics.containsKey('gc.alloc.rate.norm')
        }) {
            throw new GradleException('Mandatory FlatClimateTree suite is incomplete: all 32 timing + B/op results are required')
        }
    }
}
tasks.named('check') { dependsOn flatRegression }
// Avoid competing with the functional tests for CPU while taking measurements.
rootProject.allprojects { candidate ->
    candidate.tasks.withType(Test).configureEach { mustRunAfter flatRegression }
}
flatRun.configure { mustRunAfter(rootProject.allprojects.collect { it.tasks.withType(JavaCompile) }) }
